# =============================================================
# THR Review — Build and Deploy
# =============================================================
#
# WHAT THIS DOES:
# 1. Builds the Docker image (nginx SPA)
# 2. Pushes to GitHub Container Registry (ghcr.io)
# 3. SSHs into the VPS and pulls the new image
# 4. Restarts the review container and runs health check
#
# WHEN IT RUNS:
# - Automatically when you push to thr-main
# - Manually via the "Run workflow" button
#
# SECRETS NEEDED (set in GitHub repo Settings > Secrets):
# - VPS_SSH_KEY: Private SSH key for accessing the VPS
# - VPS_HOST: VPS IP address (148.230.85.40)
# - REVIEW_CLERK_PUBLISHABLE_KEY: Clerk publishable key (baked into SPA)
# =============================================================

name: Deploy THR Review

on:
  push:
    branches: [thr-main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-review
  cancel-in-progress: true

jobs:
  # ===========================================================
  # JOB 1: Build Docker image and push to GHCR
  # ===========================================================
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push review image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/gitforgeai/thr-review:latest
            ghcr.io/gitforgeai/thr-review:${{ github.sha }}
          build-args: |
            VITE_CONVEX_URL=https://review-convex-api.truehandroofing.com
            VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.REVIEW_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================
  # JOB 2: Deploy to VPS
  # ===========================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "=== Pulling THR Review image ==="
            cd /root/thr-deploy
            docker compose pull review
            docker compose up -d review
            echo "=== Review container restarted ==="
            docker ps --filter "name=thr-review" --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

      - name: Wait for service
        run: sleep 10

      - name: Health check
        run: |
          if curl -sf --max-time 15 -o /dev/null https://review.truehandroofing.com/healthz; then
            echo "THR Review is healthy"
          else
            echo "::warning::THR Review health check failed (may need DNS setup first)"
          fi
